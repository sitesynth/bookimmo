<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BookImmo — Find the perfect property</title>
    <meta name="description" content="The most sought-after properties are gone within hours. BookImmo gets you in first — viewings booked automatically, before the crowd. Buy or rent." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ff6625" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://book.immo/" />
    <meta property="og:title" content="BookImmo — Find the perfect property" />
    <meta property="og:description" content="Viewings booked automatically, before the crowd. Buy or rent." />
    <meta property="og:image" content="https://book.immo/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BookImmo — Find the perfect property" />
    <meta property="og:site_name" content="BookImmo" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BookImmo — Find the perfect property" />
    <meta name="twitter:description" content="Viewings booked automatically, before the crowd. Buy or rent." />
    <meta name="twitter:image" content="https://book.immo/og-image.png" />

    <!-- Canonical + hreflang -->
    <link rel="canonical" href="https://book.immo/en/" />
    <link rel="alternate" hreflang="en" href="https://book.immo/en/" />
    <link rel="alternate" hreflang="fr" href="https://book.immo/fr/" />
    <link rel="alternate" hreflang="de" href="https://book.immo/de/" />
    <link rel="alternate" hreflang="nl" href="https://book.immo/nl/" />
    <link rel="alternate" hreflang="it" href="https://book.immo/it/" />
    <link rel="alternate" hreflang="x-default" href="https://book.immo/en/" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://book.immo/#organization",
          "name": "BookImmo",
          "url": "https://book.immo/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://book.immo/apple-touch-icon.png",
            "width": 180,
            "height": 180
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "hello@book.immo",
            "contactType": "customer support"
          },
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "@id": "https://book.immo/#website",
          "url": "https://book.immo/",
          "name": "BookImmo",
          "description": "The most sought-after properties are gone within hours. BookImmo gets you in first — viewings booked automatically, before the crowd.",
          "publisher": { "@id": "https://book.immo/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://book.immo/search?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <script src="https://getlaunchlist.com/js/widget-diy.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
