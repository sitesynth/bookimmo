<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 400px;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #4CAF50;
        }
        
        .header h2 {
            margin: 0;
            color: #1a73e8;
            font-size: 16px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: #e8f5e9;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        
        .status.ready {
            color: #2e7d32;
        }
        
        .status.error {
            background: #ffebee;
            color: #c62828;
        }
        
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
        }
        
        .status.error .status-dot {
            background: #f44336;
        }
        
        .stats {
            background: white;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 12px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
        }
        
        .stat-item:last-child {
            border-bottom: none;
        }
        
        .stat-label {
            color: #666;
        }
        
        .stat-value {
            font-weight: 600;
            color: #1a73e8;
        }
        
        .info {
            background: #e3f2fd;
            border-left: 3px solid #1a73e8;
            padding: 8px 12px;
            border-radius: 2px;
            font-size: 12px;
            color: #1565c0;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        
        .buttons {
            display: flex;
            gap: 8px;
        }
        
        button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .btn-primary {
            background: #4CAF50;
            color: white;
        }
        
        .btn-primary:hover {
            background: #388e3c;
        }
        
        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #bdbdbd;
        }
        
        .footer {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>📊 ImmoScout Logger</h2>
    </div>
    
    <div class="status ready" id="status">
        <span class="status-dot"></span>
        <span id="status-text">Готово</span>
    </div>
    
    <div class="info">
        📍 Сервер: <strong>http://localhost:5555</strong><br>
        💾 Убедитесь что сервер запущен для логирования
    </div>
    
    <div class="stats">
        <div class="stat-item">
            <span class="stat-label">Контактов залогировано:</span>
            <span class="stat-value" id="contact-count">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Последняя отправка:</span>
            <span class="stat-value" id="last-contact">-</span>
        </div>
    </div>
    
    <div class="buttons">
        <button class="btn-primary" id="open-logs">Просмотр логов</button>
        <button class="btn-secondary" id="clear-logs">Очистить</button>
    </div>
    
    <div class="footer">
        🔐 Все данные только локальные. Ничего не отправляется к третьим лицам.
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
