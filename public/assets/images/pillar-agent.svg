<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="skinG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9c4"/>
      <stop offset="1" stop-color="#f0b393"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#454751"/>
      <stop offset="1" stop-color="#191a20"/>
    </linearGradient>
    <linearGradient id="suitG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3c46"/>
      <stop offset="1" stop-color="#15161b"/>
    </linearGradient>
    <linearGradient id="shirtG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ebe2"/>
    </linearGradient>
    <linearGradient id="orangeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a60"/>
      <stop offset="0.5" stop-color="#ff6625"/>
      <stop offset="1" stop-color="#d94d17"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#8a3a12" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#8a3a12" flood-opacity="0.3"/>
    </filter>
    <clipPath id="bust">
      <rect x="0" y="0" width="160" height="142" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bust)">
    <!-- shoulders / jacket -->
    <g filter="url(#drop)">
      <path d="M22 142 C22 112 42 96 66 94 L80 112 L94 94 C118 96 138 112 138 142 Z" fill="url(#suitG)"/>
    </g>
    <!-- shirt + lapels -->
    <path d="M66 94 L80 128 L94 94 L88 92 L80 104 L72 92 Z" fill="url(#shirtG)"/>
    <path d="M66 94 L80 128 L74 98 Z" fill="#000000" opacity="0.18"/>
    <path d="M94 94 L80 128 L86 98 Z" fill="#000000" opacity="0.18"/>
    <!-- tie -->
    <path d="M77 99 H83 L85.5 106 L82 128 H78 L74.5 106 Z" fill="url(#orangeG)"/>
    <!-- neck -->
    <path d="M70 80 H90 V94 C90 100 70 100 70 94 Z" fill="#ecac8c"/>
    <!-- head -->
    <ellipse cx="80" cy="60" rx="25" ry="28" fill="url(#skinG)"/>
    <ellipse cx="54" cy="62" rx="5" ry="7" fill="#f0b393"/>
    <ellipse cx="106" cy="62" rx="5" ry="7" fill="#f0b393"/>
    <!-- hair -->
    <path d="M55 58 C54 38 66 28 80 28 C96 28 106 38 105 58 C101 48 94 44 88 46 C84 47 82 50 80 50 C70 50 62 46 55 58 Z" fill="url(#hairG)"/>
    <path d="M62 40 C68 32 78 30 86 32 C78 33 70 36 62 40 Z" fill="#ffffff" opacity="0.14"/>
    <!-- cheek highlight -->
    <ellipse cx="70" cy="52" rx="7" ry="4" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- house badge -->
  <g filter="url(#soft)">
    <circle cx="124" cy="112" r="24" fill="url(#orangeG)"/>
  </g>
  <path d="M108 112 L124 98 L140 112" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M112 110 V124 C112 125.7 113.3 127 115 127 H133 C134.7 127 136 125.7 136 124 V110" fill="#ffffff"/>
  <rect x="120" y="116" width="8" height="11" rx="1.5" fill="#ff6625"/>
</svg>
