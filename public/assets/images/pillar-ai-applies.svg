<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="backG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2561c"/>
      <stop offset="1" stop-color="#c7440f"/>
    </linearGradient>
    <linearGradient id="frontG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a60"/>
      <stop offset="0.55" stop-color="#ff6625"/>
      <stop offset="1" stop-color="#e4541a"/>
    </linearGradient>
    <linearGradient id="flapG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb088"/>
      <stop offset="1" stop-color="#ff7a3c"/>
    </linearGradient>
    <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3ede4"/>
    </linearGradient>
    <linearGradient id="inkG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3c46"/>
      <stop offset="1" stop-color="#191a20"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#8a3a12" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1b1c22" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- envelope back + open flap -->
  <g filter="url(#drop)">
    <rect x="20" y="58" width="120" height="80" rx="14" fill="url(#backG)"/>
  </g>
  <path d="M20 72 L80 28 L140 72 L80 100 Z" fill="url(#flapG)"/>
  <path d="M80 28 L140 72 L80 100 Z" fill="#000000" opacity="0.06"/>

  <!-- letter -->
  <rect x="38" y="48" width="84" height="72" rx="8" fill="url(#paperG)"/>
  <rect x="50" y="62" width="44" height="4" rx="2" fill="#ffd0b8"/>
  <rect x="50" y="72" width="60" height="4" rx="2" fill="#ffe4d6"/>
  <rect x="50" y="82" width="36" height="4" rx="2" fill="#ffe4d6"/>

  <!-- envelope front pocket -->
  <path d="M20 86 L68 118 C75 123 85 123 92 118 L140 86 V124 C140 131.7 133.7 138 126 138 H34 C26.3 138 20 131.7 20 124 Z" fill="url(#frontG)"/>
  <path d="M20 86 L68 118 C75 123 85 123 92 118 L140 86 L140 92 L92 124 C85 129 75 129 68 124 L20 92 Z" fill="#ffffff" opacity="0.22"/>

  <!-- sparkle badge -->
  <g filter="url(#soft)">
    <rect x="94" y="88" width="48" height="48" rx="14" fill="url(#inkG)"/>
  </g>
  <path d="M118 96 C119.8 106 121.6 107.8 131.6 109.6 C121.6 111.4 119.8 113.2 118 123.2 C116.2 113.2 114.4 111.4 104.4 109.6 C114.4 107.8 116.2 106 118 96 Z" fill="#ffffff"/>
  <path d="M130 120 C130.7 123.5 131.4 124.2 134.9 124.9 C131.4 125.6 130.7 126.3 130 129.8 C129.3 126.3 128.6 125.6 125.1 124.9 C128.6 124.2 129.3 123.5 130 120 Z" fill="#ffb088"/>
  <path d="M105 95 C105.5 97.5 106 98 108.5 98.5 C106 99 105.5 99.5 105 102 C104.5 99.5 104 99 101.5 98.5 C104 98 104.5 97.5 105 95 Z" fill="#ffb088"/>
</svg>
