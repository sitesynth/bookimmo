<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="inkG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3c46"/>
      <stop offset="1" stop-color="#191a20"/>
    </linearGradient>
    <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3ede4"/>
    </linearGradient>
    <linearGradient id="orangeG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a60"/>
      <stop offset="0.5" stop-color="#ff6625"/>
      <stop offset="1" stop-color="#d94d17"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6f0"/>
      <stop offset="1" stop-color="#ffd9c4"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#8a3a12" flood-opacity="0.22"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#8a3a12" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- window card -->
  <g filter="url(#drop)">
    <rect x="18" y="26" width="124" height="108" rx="16" fill="url(#paperG)"/>
  </g>
  <path d="M18 42 C18 33.2 25.2 26 34 26 H126 C134.8 26 142 33.2 142 42 V50 H18 Z" fill="url(#inkG)"/>
  <rect x="18" y="47" width="124" height="4" fill="#111217" opacity="0.35"/>
  <circle cx="34" cy="38" r="4.5" fill="#ff6625"/>
  <circle cx="47" cy="38" r="4.5" fill="#ffb088"/>
  <circle cx="60" cy="38" r="4.5" fill="#ffe4d2"/>
  <!-- card edge highlight -->
  <rect x="24" y="54" width="112" height="2" rx="1" fill="#ffffff" opacity="0.9"/>

  <!-- shield -->
  <g filter="url(#soft)">
    <path d="M80 62 L108 72 V90 C108 106 97 117 80 124 C63 117 52 106 52 90 V72 Z" fill="url(#orangeG)"/>
  </g>
  <path d="M80 70 L101 77.5 V90 C101 102 93 110 80 115.5 C67 110 59 102 59 90 V77.5 Z" fill="url(#shieldInner)"/>
  <path d="M80 70 L101 77.5 V84 C94 80 87 78 80 78 C73 78 66 80 59 84 V77.5 Z" fill="#ffffff" opacity="0.55"/>
  <path d="M69 92 L77 100 L93 83" fill="none" stroke="#ff6625" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
